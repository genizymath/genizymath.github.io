    <style>
      @-webkit-keyframes rotation {
        from {
          -webkit-transform: rotate(0deg);
        }

        to {
          -webkit-transform: rotate(360deg);
        }
      }

      @-moz-keyframes rotation {
        from {
          -moz-transform: rotate(0deg);
        }

        to {
          -moz-transform: rotate(360deg);
        }
      }

      @-o-keyframes rotation {
        from {
          -o-transform: rotate(0deg);
        }

        to {
          -o-transform: rotate(360deg);
        }
      }

      @keyframes rotation {
        from {
          transform: rotate(0deg);
        }

        to {
          transform: rotate(360deg);
        }
      }

      body {
        font-family: arial;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        min-width: 100vw;
        background:radial-gradient( 56.63% 56.63% at 50% 43.37%, #1c1726 0%, #060612 100%);
      }

      .emscripten {
        padding-right: 0;
        margin-left: auto;
        margin-right: auto;
        display: block;
      }

      div.emscripten {
        text-align: center;
      }

      /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
      canvas.emscripten {
        display: none;
        border: 0px none;
        background-color: black;
        position: relative;
        transition: opacity 5s ease-in;
        -webkit-transition: opacity 5s ease-in;
        opacity: 0;
        image-rendering: optimizeQuality;           /* Older versions of FF          */
        image-rendering: auto;                      /* Awesome future-browsers       */
        -ms-interpolation-mode: bicubic;            /* IE                            */ 
      }

      canvas.active {
        animation-name: fadeIn;
        animation-duration: 2s;
        opacity: 1;
      }
      @keyframes fadeIn {
        0% {
          opacity: 0;
        }

        100% {
          opacity: 1;
        }
      }

      .spinner {
        height: 30px;
        width: 30px;

        -webkit-animation: rotation 0.8s linear infinite;
        -moz-animation: rotation 0.8s linear infinite;
        -o-animation: rotation 0.8s linear infinite;
        animation: rotation 0.8s linear infinite;

        border: 5px solid #bdff00;
        border-top: 5px solid #719900;
        border-radius: 100%;
      }

      #status {
        display: inline-block;
        vertical-align: top;
        font-weight: bold;
        color: white;
      }

      #progress {
        width: 250px;
        height: 10px;
        -webkit-appearance: none;
        appearance: none;
        padding: 5px;
      }

      /* Determines the style of the background of the progress bar */
      progress[value]::-webkit-progress-bar {
        background-color: #8492a6;
        height: 10px;
        border-radius: 15px;
      }
      /* Determines the style of the completed part of the progress bar */
      progress[value]::-webkit-progress-value {
        background-image: -webkit-linear-gradient(left, #719900, #bdff00);
        height: 10px;
        border-radius: 15px;
      }

      div.loading {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        pointer-events: none;
      }
      div.loading > * {
        padding: 10px;
        margin: 10px;
      }

      /* Match the ROAM launcher: black background, crisp canvas, and a large loading label. */
      html, body { background: #000; }
      body { display: flex; flex-direction: column; align-items: center; overflow: hidden; }
      canvas.emscripten { padding: 0; border: 0; image-rendering: pixelated; }
      #loading-text { color: white; font: clamp(22px, 4vw, 48px) cursive; text-align: center; }
      #status, #progress { display: none; }
    </style>

      function ensureAspectRatio() {
        if(canvasElement===undefined) {
          return 
        } 

        canvasElement.className = canvasElement.className.includes("active")
          ? canvasElement.className
          : canvasElement.className + " active";
        if (!CHANGE_ASPECT_RATIO) {
          return;
        }

        
        /* NOTE(robertz): The default canvas sizes while loading are 300x150,
        * let us not use those values. eventually, there will most likely be a 
         * game of that dimension, so this should be removed
         */
        if (canvasElement.height === 150 && canvasElement.width === 300) {
          return;
        }
        
        if (startingHeight === undefined && startingWidth === undefined) {
          startingHeight = canvasElement.height;
          startingWidth = canvasElement.width;
          startingAspect = startingWidth / startingHeight;
        }
        
        const maxWidth = window.innerWidth;
        const maxHeight = window.innerHeight;
        var newHeight, newWidth;

        // Find the limiting dimension.
        var heightQuotient = startingHeight / maxHeight;
        var widthQuotient = startingWidth / maxWidth;
        
        if (heightQuotient > widthQuotient) {          
          // Max out on height.
          newHeight = maxHeight;
          newWidth = newHeight * startingAspect;
        } else {          
          // Max out on width.
          newWidth = maxWidth;
          newHeight = newWidth / startingAspect;
        }

        canvasElement.style.height = newHeight + "px";
        canvasElement.style.width = newWidth + "px";
      
    }

      /* Observe the dimensions of body and ensureAspectRatio of the canvas (whilst taking up maximum space)
       *
       * NOTE(robertz):
       *  We also need to request an Animation Frame to do this, if we do not, resizeObserver might throw error
       *  "ResizeObserver loop limit exceeded", which means that 
       *  "[...] ResizeObserver was not able to deliver all observations within a single animation frame"
       *  https://stackoverflow.com/a/50387233 (source).
       *  
       *  There are different ways to solve the issue, since the error is benign (meaning it wont crash anything)
       *  we could choose to ignore it via changing the window.onerror method, i.e
       *  ```
       *  window.onerror((event)=> {
       *    if(event==="ResizeObserver loop limit exceeded") {
       *       return
       *    }
       *     ///...rest
       *  }
       *  ```
       *  But for now we request an animationFrame which seems to be the recommended way to go about it.
       */
      const resizeObserver = new ResizeObserver(() => window.requestAnimationFrame(ensureAspectRatio));
      resizeObserver.observe(document.body);

    const loadingText = document.querySelector('#loading-text');
    const originalFetch = window.fetch.bind(window);
    const assetURLs = new Map();
    let totalBytes = DOWNLOAD_ASSETS.reduce((sum, asset) =>
      sum + asset.parts.reduce((bytes, part) => bytes + part.bytes, 0), 0);
    let loadedBytes = 0;
    let loadingFailed = false;

    function updateLoadingText() {
      if (loadingFailed) return;
      const mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
      const mbTotal = (totalBytes / (1024 * 1024)).toFixed(2);
      loadingText.textContent = `LOADING... ${mbDone} MB / ${mbTotal} MB`;
    }

    async function fetchWithProgress(part) {
      const response = await originalFetch(part.url);
      if (!response.ok) throw new Error(`Could not load ${part.url} (HTTP ${response.status})`);
      let expected = part.bytes;
      const chunks = [];
      let received = 0;
      if (response.body) {
        const reader = response.body.getReader();
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          received += value.byteLength;
          loadedBytes += value.byteLength;
          chunks.push(value);
          updateLoadingText();
        }
      } else {
        const bytes = new Uint8Array(await response.arrayBuffer());
        received = bytes.byteLength;
        loadedBytes += received;
        chunks.push(bytes);
      }
      totalBytes += received - expected;
      updateLoadingText();
      return new Blob(chunks);
    }

    function assetKey(url) {
      const resolved = new URL(url, document.baseURI);
      return resolved.origin + resolved.pathname.toLowerCase();
    }

    function mimeType(url) {
      if (url.endsWith('.js')) return 'text/javascript';
      if (url.endsWith('.wasm')) return 'application/wasm';
      if (url.endsWith('.mp4')) return 'video/mp4';
      return 'application/octet-stream';
    }

    async function mergeFiles(asset) {
      const buffers = [];
      for (const part of asset.parts) buffers.push(await fetchWithProgress(part));
      const merged = new Blob(buffers, { type: mimeType(asset.url) });
      assetURLs.set(assetKey(asset.url), URL.createObjectURL(merged));
    }

    function resolveAsset(url) {
      try { return assetURLs.get(assetKey(url)) || url; }
      catch { return url; }
    }

    function installAssetRoutes() {
      // Route both loading paths used by the GameMaker and FMOD runtimes to the downloaded blobs.
      window.fetch = function(input, init) {
        const url = input instanceof Request ? input.url : String(input);
        const mapped = resolveAsset(url);
        return originalFetch(mapped === url ? input :
          input instanceof Request ? new Request(mapped, input) : mapped, init);
      };
      const originalOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function(method, url, ...rest) {
        return originalOpen.call(this, method, resolveAsset(String(url)), ...rest);
      };
      // Intro and rank videos are media URLs, so fetch/XHR interception alone is insufficient.
      const mediaSource = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, 'src');
      Object.defineProperty(HTMLMediaElement.prototype, 'src', {
        configurable: mediaSource.configurable,
        enumerable: mediaSource.enumerable,
        get: mediaSource.get,
        set(url) { mediaSource.set.call(this, resolveAsset(String(url))); }
      });
    }

    function loadScript(url) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = resolveAsset(url);
        script.onload = resolve;
        script.onerror = () => reject(new Error(`Could not start ${url}`));
        document.body.appendChild(script);
      });
    }

    async function startGame() {
      updateLoadingText();
      // Keep downloads bounded while allowing the counter to move throughout each large part.
      let nextAsset = 0;
      await Promise.all(Array.from({ length: 3 }, async () => {
        while (!loadingFailed && nextAsset < DOWNLOAD_ASSETS.length) {
          const asset = DOWNLOAD_ASSETS[nextAsset++];
          await mergeFiles(asset);
        }
      }));
      installAssetRoutes();
      Module.locateFile = file => new URL(file, document.baseURI).href;
      await loadScript('fmodstudio.js');
      await loadScript('pan-audio.js');
      await PANAudio.boot('./');
      await loadScript('runner.js');
    }

    startGame().catch(error => {
      loadingFailed = true;
      console.error(error);
      loadingText.textContent = `Loading failed: ${error.message}`;
      document.querySelector('.loading').style.display = 'flex';
      document.getElementById('spinner').style.display = 'none';
    });
    window.addEventListener('pagehide', event => {
      if (!event.persisted) for (const url of assetURLs.values()) URL.revokeObjectURL(url);
    });
</script>
  </body>
</html>
